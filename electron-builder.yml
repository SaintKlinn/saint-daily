appId: com.saintdaily.app
productName: Saint Daily
directories:
  output: release
  buildResources: resources
publish:
  provider: github
files:
  - out/**/*
# `files` ne contient que out/**, donc resources/icon.png n'est pas dans
# l'asar. L'icône du system tray est chargée au runtime depuis
# process.resourcesPath (voir src/main/tray.ts) : elle doit être copiée
# ici, sinon `new Tray(...)` lève dans l'app installée.
extraResources:
  - from: resources/icon.png
    to: icon.png
win:
  target: nsis
  icon: resources/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
