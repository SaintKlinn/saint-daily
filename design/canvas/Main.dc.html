<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');
    * { box-sizing: border-box; }
    body { margin: 0; background: #03231A; font-family: 'IBM Plex Sans', sans-serif; }
    a { color: #E7B94E; text-decoration: none; }
    a:hover { color: #F3CE73; }
    ::selection { background: #C08A2A; color: #03231A; }
  </style>
</helmet>
<div style="width:1280px; height:800px; display:flex; background:#03231A; color:#F8E7C9; overflow:hidden;">

  <nav style="width:72px; min-width:72px; height:800px; background:#064E3B; border-right:1px solid #146856; display:flex; flex-direction:column; align-items:center; padding:24px 0 0 0; gap:40px;">
    <svg width="30" height="20" viewBox="0 0 128 85" aria-hidden="true">
      <g stroke="{{accent}}" stroke-linecap="round">
        <line x1="64" y1="83" x2="64" y2="58" stroke-width="3" stroke-opacity="1"/>
        <line x1="48" y1="78" x2="38" y2="48" stroke-width="2.6" stroke-opacity="0.85"/>
        <line x1="80" y1="78" x2="90" y2="48" stroke-width="2.6" stroke-opacity="0.85"/>
        <line x1="34" y1="66" x2="16" y2="32" stroke-width="2.2" stroke-opacity="0.65"/>
        <line x1="94" y1="66" x2="112" y2="32" stroke-width="2.2" stroke-opacity="0.65"/>
        <line x1="24" y1="48" x2="6" y2="14" stroke-width="1.8" stroke-opacity="0.45"/>
        <line x1="104" y1="48" x2="122" y2="14" stroke-width="1.8" stroke-opacity="0.45"/>
      </g>
    </svg>
    <div style="display:flex; flex-direction:column; align-items:center; gap:30px;">
      <span style="color:{{accent}}" aria-label="Accueil" title="Accueil">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11.5 12 4l8 7.5"/><path d="M6 10v9h12v-9"/><path d="M10 19v-5h4v5"/></svg>
      </span>
      <span style="color:#8FA396" aria-label="Skills" title="Skills">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="14" y2="18"/></svg>
      </span>
      <span style="color:#8FA396" aria-label="Réglages" title="Réglages">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 3v2.4M12 18.6V21M4.9 4.9l1.7 1.7M17.4 17.4l1.7 1.7M3 12h2.4M18.6 12H21M4.9 19.1l1.7-1.7M17.4 6.6l1.7-1.7"/></svg>
      </span>
    </div>
  </nav>

  <main style="flex:1; padding:48px 56px; display:flex; flex-direction:column; gap:36px; overflow:hidden;">

    <header style="display:flex; align-items:flex-end; justify-content:space-between;">
      <div>
        <div style="font-family:'IBM Plex Mono', monospace; font-size:12px; letter-spacing:0.12em; text-transform:uppercase; color:#8FA396;">Mardi 19h32</div>
        <h1 style="margin:6px 0 0 0; font-family:'IBM Plex Serif', serif; font-weight:500; font-size:34px; color:#F8E7C9;">Bon retour.</h1>
      </div>
      <button style="display:flex; align-items:center; gap:8px; background:{{accent}}; color:#03231A; border:none; padding:13px 22px; font-family:'IBM Plex Sans', sans-serif; font-weight:600; font-size:14px; cursor:pointer;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="4" x2="12" y2="20"/><line x1="4" y1="12" x2="20" y2="12"/></svg>
        Nouvelle entrée
      </button>
    </header>

    <section style="display:grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap:20px;">

      <div style="background:#064E3B; border:1px solid #146856; padding:22px 24px; display:flex; flex-direction:column; gap:6px;">
        <div style="font-family:'IBM Plex Mono', monospace; font-size:11px; letter-spacing:0.1em; text-transform:uppercase; color:#8FA396;">Skills actifs</div>
        <div style="font-family:'IBM Plex Serif', serif; font-size:32px; color:#F8E7C9;">3</div>
      </div>

      <div style="background:#064E3B; border:1px solid #146856; padding:22px 24px; display:flex; flex-direction:column; gap:6px;">
        <div style="font-family:'IBM Plex Mono', monospace; font-size:11px; letter-spacing:0.1em; text-transform:uppercase; color:#8FA396;">Séries en cours</div>
        <div style="font-family:'IBM Plex Serif', serif; font-size:32px; color:{{accent}};">3</div>
      </div>

      <div style="background:#064E3B; border:1px solid #146856; padding:22px 24px; display:flex; flex-direction:column; gap:6px;">
        <div style="font-family:'IBM Plex Mono', monospace; font-size:11px; letter-spacing:0.1em; text-transform:uppercase; color:#8FA396;">Pratiqué ce mois-ci</div>
        <div style="font-family:'IBM Plex Serif', serif; font-size:32px; color:#F8E7C9;">12h 40</div>
      </div>

    </section>

    <section style="display:flex; flex-direction:column; gap:14px; flex:1; min-height:0;">
      <h2 style="margin:0; font-family:'IBM Plex Sans', sans-serif; font-weight:600; font-size:15px; color:#F8E7C9;">Rappels dus</h2>

      <div style="display:flex; flex-direction:column; gap:1px; background:#146856; border:1px solid #146856;">

        <div style="background:#0B5F49; padding:18px 22px; display:flex; align-items:center; gap:18px;">
          <svg width="36" height="36" viewBox="0 0 36 36" aria-hidden="true">
            <circle cx="18" cy="18" r="15" fill="none" stroke="#146856" stroke-width="3"/>
            <circle cx="18" cy="18" r="15" fill="none" stroke="#E7B94E" stroke-width="3" stroke-linecap="round" stroke-dasharray="94.2" stroke-dashoffset="70.6" transform="rotate(-90 18 18)"/>
          </svg>
          <div style="flex:1;">
            <div style="font-family:'IBM Plex Serif', serif; font-size:18px; color:#F8E7C9;">Piano</div>
            <div style="font-family:'IBM Plex Sans', sans-serif; font-size:13px; color:#8FA396; margin-top:2px;">#musique #instrument</div>
          </div>
          <div style="font-family:'IBM Plex Mono', monospace; font-size:13px; color:#8FA396;">pas pratiqué depuis 6 j</div>
          <a href="#" style="font-family:'IBM Plex Sans', sans-serif; font-size:13px; font-weight:600; border:1px solid {{accent}}; color:{{accent}}; padding:8px 16px;">Logger</a>
        </div>

        <div style="background:#0B5F49; padding:18px 22px; display:flex; align-items:center; gap:18px;">
          <svg width="36" height="36" viewBox="0 0 36 36" aria-hidden="true">
            <circle cx="18" cy="18" r="15" fill="none" stroke="#146856" stroke-width="3"/>
            <circle cx="18" cy="18" r="15" fill="none" stroke="#E7B94E" stroke-width="3" stroke-linecap="round" stroke-dasharray="94.2" stroke-dashoffset="84.8" transform="rotate(-90 18 18)"/>
          </svg>
          <div style="flex:1;">
            <div style="font-family:'IBM Plex Serif', serif; font-size:18px; color:#F8E7C9;">Espagnol</div>
            <div style="font-family:'IBM Plex Sans', sans-serif; font-size:13px; color:#8FA396; margin-top:2px;">#langues</div>
          </div>
          <div style="font-family:'IBM Plex Mono', monospace; font-size:13px; color:#8FA396;">pas pratiqué depuis 8 j</div>
          <a href="#" style="font-family:'IBM Plex Sans', sans-serif; font-size:13px; font-weight:600; border:1px solid {{accent}}; color:{{accent}}; padding:8px 16px;">Logger</a>
        </div>

      </div>
    </section>

  </main>
</div>
</x-dc>
<script data-dc-script data-props='{"accent":{"editor":"color","default":"#E7B94E","options":["#E7B94E","#C08A2A","#8A5F1B"]}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#E7B94E' };
  }
}
</script>
</body>
</html>
